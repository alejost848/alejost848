<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes" />

    <title>Alejandro Sanclemente - Motion Designer and PWA Developer</title>
    <meta
      name="description"
      content="Interactive Media Designer based in Tuluá, Colombia. I specialize in motion design, UX design and web development."
    />

    <base href="/" />

    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#191919" />

    <!-- iOS and PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alejandro Sanclemente" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Alejandro Sanclemente" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alejandro Sanclemente - Motion Designer and PWA Developer" />
    <meta
      property="og:description"
      content="Interactive Media Designer based in Tuluá, Colombia. I specialize in motion design, UX design and web development."
    />
    <meta property="og:image" content="/images/cover.png" />

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Global Styles -->
    <style>
      :root {
        --app-background-color: #191919;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        min-width: 100%;
        min-height: 100vh;
        background-color: var(--app-background-color);
        color: #f4f4f4;
        overflow-x: hidden;
        overflow-y: scroll;
        transition: background-color 0.2s cubic-bezier(0.4, 0, 1, 1);
        -webkit-tap-highlight-color: transparent;
      }

      /* View Transitions */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 250ms;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  </head>
  <body>
    <portfolio-app></portfolio-app>

    <noscript>
      Please enable JavaScript to view this website.
    </noscript>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
