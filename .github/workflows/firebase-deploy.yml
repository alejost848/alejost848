name: Deploy to Firebase on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Web App & Sync Template
        run: npm run build

      - name: Install Cloud Functions Dependencies
        run: npm --prefix functions ci

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALEJOST848_AFEA9 }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --non-interactive
